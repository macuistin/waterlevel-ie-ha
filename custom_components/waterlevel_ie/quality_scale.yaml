# Integration Quality Scale: Water Level IE
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
# Every Bronze, Silver and Gold rule is done or exempt. Platinum has todos.
# The docs-* rules point at sections of README.md.

rules:
  # ── Bronze ──────────────────────────────────────────────────────────────────
  action-setup:
    status: exempt
    comment: The integration registers no actions
  appropriate-polling: done    # 15 minutes, the gauges' own reporting interval and the OPW's requested limit
  brands: done                 # icon and logo (light and dark) in brand/
  common-modules: done         # coordinator.py, entity.py, const.py
  config-flow-test-coverage: done  # every step, error and abort in tests/test_config_flow.py
  config-flow: done            # menu, river, select_station and station_number steps, each field with data_description
  dependency-transparency: done  # requirements: []
  docs-actions:
    status: exempt
    comment: The integration registers no actions
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done  # README: Removing the integration
  entity-event-setup:
    status: exempt
    comment: No entity subscribes to events; the number entities only restore their last value
  entity-unique-id: done       # f"{DOMAIN}_{station}_{key}", unchanged since 1.0
  has-entity-name: done        # WaterlevelEntity sets _attr_has_entity_name
  runtime-data: done           # entry.runtime_data holds the coordinator
  test-before-configure: done  # the flow probes the station before creating the entry
  test-before-setup: done      # async_config_entry_first_refresh raises ConfigEntryNotReady
  unique-config-entry: done    # unique id is the station number

  # ── Silver ──────────────────────────────────────────────────────────────────
  action-exceptions:
    status: exempt
    comment: The integration registers no actions
  config-entry-unloading: done
  docs-configuration-parameters: done  # README: the options table under Configuration
  docs-installation-parameters: done  # README: the setup field table under Configuration
  entity-unavailable: done     # last readings kept up to 3 h, then UpdateFailed; flood stage is unknown with no level
  integration-owner: done      # @macuistin
  log-when-unavailable: done   # the coordinator logs the outage once and the recovery once; per-sensor failures log at debug
  parallel-updates: done       # PARALLEL_UPDATES = 0 on every platform
  reauthentication-flow:
    status: exempt
    comment: waterlevel.ie needs no account
  test-coverage: done          # 97% with branches; CI fails below 95% (fail_under in pyproject.toml)

  # ── Gold ────────────────────────────────────────────────────────────────────
  devices: done                # one device per station
  diagnostics: done            # diagnostics.py; all of it is public station data
  discovery:
    status: exempt
    comment: A cloud service; there is nothing on the network to discover
  discovery-update-info:
    status: exempt
    comment: A cloud service; there is nothing on the network to discover
  docs-data-update: done  # README: How the data is updated
  docs-examples: done  # README: Automation examples
  docs-known-limitations: done  # README: Known limitations
  docs-supported-devices: done  # README: Supported stations
  docs-supported-functions: done  # README: Entities
  docs-troubleshooting: done  # README: Troubleshooting
  docs-use-cases: done  # README: Use cases
  dynamic-devices:
    status: exempt
    comment: Each config entry is one station, so there is exactly one device per entry
  entity-category: done        # battery and signal are diagnostic, thresholds are config
  entity-device-class: done    # distance, temperature, voltage, signal strength, enum, safety
  entity-disabled-by-default: done  # temperature, battery voltage and signal strength
  entity-translations: done    # every entity has a translation_key and a name in strings.json
  exception-translations: done # the update failure uses translation_key update_failed
  icon-translations: done      # icons.json, with state icons for the flood stage and alert
  reconfiguration-flow:
    status: exempt
    comment: The station is the entry's identity; a different station is a new entry
  repair-issues:
    status: exempt
    comment: No problem the user can fix; an outage is shown as unavailable entities
  stale-devices:
    status: exempt
    comment: The single device is removed with its config entry

  # ── Platinum ────────────────────────────────────────────────────────────────
  async-dependency:
    status: todo
    comment: The waterlevel.ie client is api.py inside the integration, not yet a library on PyPI
  inject-websession: done      # async_get_clientsession everywhere
  strict-typing: todo
